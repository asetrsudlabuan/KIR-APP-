<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KIR APP">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>KIR APP</title>
  <style>
    :root{--blue:#1f4e78;--blue2:#2f75b5;--bg:#ffffff;--text:#17324a;--muted:#64748b}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    /* Aplikasi tampil penuh layar, tanpa banner. Hanya status bar/notch yang diberi jarak aman */
    .shell{position:fixed;inset:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
    .frame{display:block;width:100%;height:100%;border:0;background:var(--bg)}
    .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);z-index:2;transition:opacity .2s}
    .loading.hide{opacity:0;pointer-events:none}
    .loader-card{text-align:center}
    .spinner{width:42px;height:42px;border:5px solid #dbe7f3;border-top-color:var(--blue2);border-right-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:auto}
    .loading b{display:block;margin-top:12px;color:var(--blue);font-size:15px}
    .loading span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Tombol install kecil, hanya muncul di browser (bukan saat sudah diinstall) */
    .install{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;border:0;border-radius:999px;padding:10px 16px;background:var(--blue);color:#fff;font-weight:800;font-size:12px;box-shadow:0 6px 20px rgba(15,42,68,.3);display:none}
    .install.show{display:block}
    .ios-note{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:14px 15px;box-shadow:0 15px 45px rgba(15,42,68,.2);display:none;color:var(--text);font-size:13px;line-height:1.45}
    .ios-note.show{display:block}.ios-note b{color:var(--blue)}
    .ios-note button{float:right;border:0;background:#eef3f8;color:var(--blue);border-radius:8px;padding:5px 8px;font-weight:700}
  </style>
</head>
<body>
<div class="shell">
  <iframe id="appFrame" class="frame" title="KIR APP" allow="camera; microphone; geolocation" referrerpolicy="strict-origin-when-cross-origin" src="https://script.google.com/macros/s/AKfycbyUeQ2HqZ7qg4klCgnye4wEB2VRAxKXsSguKTDilzp9cAAG-ylowjBCo8k4zaPgo5hr/exec"></iframe>
</div>
<div id="loading" class="loading"><div class="loader-card"><div class="spinner"></div><b>Membuka KIR APP</b><span>Mohon tunggu sebentar...</span></div></div>
<button id="installBtn" class="install" type="button">Install</button>
<div id="iosNote" class="ios-note"><button onclick="closeIosNote()">Tutup</button><b>Install di iPhone/iPad</b><br>Ketuk <b>Bagikan</b> di Safari → <b>Tambah ke Layar Utama</b> → <b>Tambah</b>.</div>
<script>
  const frame=document.getElementById('appFrame'),loading=document.getElementById('loading'),installBtn=document.getElementById('installBtn');
  let deferredPrompt=null;
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hide'),120));
  setTimeout(()=>loading.classList.add('hide'),8000);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!standalone())installBtn.classList.add('show')});
  installBtn.addEventListener('click',async()=>{
    if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.classList.remove('show');return}
    showIosNote();
  });
  window.addEventListener('appinstalled',()=>{installBtn.classList.remove('show');deferredPrompt=null});
  function showIosNote(){if(isIOS()&&!standalone())document.getElementById('iosNote').classList.add('show')}
  function closeIosNote(){document.getElementById('iosNote').classList.remove('show')}
  if(isIOS()&&!standalone())installBtn.classList.add('show');
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
