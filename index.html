<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f4e78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KIR APP">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>KIR APP</title>
  <style>
    :root{--blue:#1f4e78;--blue2:#2f75b5;--bg:#f4f7fb;--text:#17324a;--muted:#64748b;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
    .shell{height:100dvh;display:flex;flex-direction:column;min-height:0}
    .bar{height:58px;min-height:58px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px;box-shadow:0 2px 10px rgba(15,42,68,.18);z-index:5}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--blue);font-weight:900;font-size:14px;flex:none}.brand-text{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-sub{font-size:10px;opacity:.8;font-weight:500}
    .actions{display:flex;gap:7px;align-items:center;flex:none}.btn{border:0;border-radius:9px;padding:8px 11px;font-weight:800;font-size:12px;cursor:pointer}.install{background:#fff;color:var(--blue)}.reload{background:rgba(255,255,255,.15);color:#fff}
    .frame-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#f5f7fb}.frame{display:block;width:100%;height:100%;border:0;background:#f5f7fb}
    .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(245,247,251,.92);z-index:2;transition:opacity .2s}.loading.hide{opacity:0;pointer-events:none}.loader-card{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:22px 26px;text-align:center;box-shadow:0 15px 45px rgba(15,42,68,.15)}.spinner{width:42px;height:42px;border:5px solid #dbe7f3;border-top-color:var(--blue2);border-right-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:auto}.loading b{display:block;margin-top:12px;color:var(--blue);font-size:15px}.loading span{display:block;margin-top:3px;color:var(--muted);font-size:11px}@keyframes spin{to{transform:rotate(360deg)}}
    .ios-note{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bottom));z-index:20;background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:14px 15px;box-shadow:0 15px 45px rgba(15,42,68,.2);display:none;color:var(--text);font-size:13px;line-height:1.45}.ios-note.show{display:block}.ios-note b{color:var(--blue)}.ios-note button{float:right;border:0;background:#eef3f8;color:var(--blue);border-radius:8px;padding:5px 8px;font-weight:700}
    @media(max-width:520px){.bar{height:54px;min-height:54px;padding:0 9px}.logo{width:31px;height:31px}.brand-text{font-size:13px}.brand-sub{font-size:9px}.btn{padding:8px 9px}.reload{font-size:0;width:35px;height:35px}.reload::after{content:'↻';font-size:17px}}
    @media(display-mode:standalone){.bar{height:56px;min-height:56px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand"><div class="logo">KIR</div><div><div class="brand-text">Kartu Inventaris Ruangan</div><div class="brand-sub">PWA • KIR APP</div></div></div>
    <div class="actions"><button id="installBtn" class="btn install" type="button" hidden>Install</button><button class="btn reload" type="button" aria-label="Muat ulang aplikasi" onclick="reloadApp()">↻</button></div>
  </header>
  <main class="frame-wrap">
    <div id="loading" class="loading"><div class="loader-card"><div class="spinner"></div><b>Membuka KIR APP</b><span>Mohon tunggu sebentar...</span></div></div>
    <iframe id="appFrame" class="frame" title="KIR APP" allow="camera; microphone; geolocation" referrerpolicy="strict-origin-when-cross-origin" src="https://script.google.com/macros/s/AKfycbyUeQ2HqZ7qg4klCgnye4wEB2VRAxKXsSguKTDilzp9cAAG-ylowjBCo8k4zaPgo5hr/exec"></iframe>
  </main>
</div>
<div id="iosNote" class="ios-note"><button onclick="closeIosNote()">Tutup</button><b>Install di iPhone/iPad</b><br>Ketuk <b>Bagikan</b> di Safari → <b>Tambah ke Layar Utama</b> → <b>Tambah</b>.</div>
<script>
  const frame=document.getElementById('appFrame'),loading=document.getElementById('loading'),installBtn=document.getElementById('installBtn');
  let deferredPrompt=null;
  frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hide'),120));
  function reloadApp(){loading.classList.remove('hide');frame.src=frame.src.split('#')[0]+'#reload='+Date.now();}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false;});
  installBtn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true;return;}showIosNote();});
  window.addEventListener('appinstalled',()=>{installBtn.hidden=true;deferredPrompt=null;});
  function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream}
  function showIosNote(){if(isIOS()&&!window.matchMedia('(display-mode: standalone)').matches)document.getElementById('iosNote').classList.add('show')}
  function closeIosNote(){document.getElementById('iosNote').classList.remove('show')}
  if(isIOS()&&!window.matchMedia('(display-mode: standalone)').matches){installBtn.hidden=false;installBtn.textContent='Install'}
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
